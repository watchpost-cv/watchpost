name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.25.x'}
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
  build:
    strategy:
      matrix:
        include:
          - {os: linux, arch: amd64, ext: ''}
          - {os: linux, arch: arm64, ext: ''}
          - {os: darwin, arch: amd64, ext: ''}
          - {os: darwin, arch: arm64, ext: ''}
          - {os: windows, arch: amd64, ext: '.exe'}
          - {os: windows, arch: arm64, ext: '.exe'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.25.x'}
      - run: GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o watchpost-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/watchpost
      - uses: actions/upload-artifact@v4
        with:
          name: watchpost-${{ matrix.os }}-${{ matrix.arch }}
          path: watchpost-*
