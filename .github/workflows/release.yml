name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.25.x'}
      - run: ./packaging/build-release.sh "${GITHUB_REF_NAME}"
      - run: (cd dist && sha256sum -c SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with: {files: 'dist/*'}
