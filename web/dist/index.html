<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watchpost</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head><body><header><strong>Watchpost</strong><span>WP00–WP05 development build</span></header><main><section class="intro"><p class="eyebrow">Operational evidence, connected</p><h1>Posts</h1><p>Every monitored system, service, endpoint, application, or device is a post.</p></section><section class="grid"><form id="setup"><h2>First administrator</h2><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="12" required></label><button>Complete setup</button></form><form id="login"><h2>Sign in</h2><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button>Sign in</button></form><form id="create" hidden><h2>Enroll a post</h2><label>ID<input name="id" pattern="[a-z0-9][a-z0-9-]{0,62}" required></label><label>Name<input name="name" required></label><label>Kind<select name="kind"><option value="host">Host</option><option value="http_endpoint">HTTP endpoint</option><option value="tcp_service">TCP service</option><option value="tls_certificate">TLS certificate</option></select></label><button>Create post</button></form></section><p id="message" role="status"></p><section id="inventory" hidden><h2>Inventory</h2><div id="posts" class="posts"></div></section></main></body></html>
